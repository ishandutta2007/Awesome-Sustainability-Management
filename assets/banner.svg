<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a14" />
      <stop offset="50%" stop-color="#0b2e23" />
      <stop offset="100%" stop-color="#04130e" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981; #06b6d4; #3b82f6; #10b981" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399; #38bdf8; #60a5fa; #34d399" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#059669">
        <animate attributeName="stop-color" values="#059669; #0284c7; #2563eb; #059669" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Eco Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #34d399;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite;
      }
      .float-leaf {
        animation: float 6s ease-in-out infinite alternate;
      }
      .wave-path {
        animation: wave 10s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.15); opacity: 0.6; }
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-15px) rotate(8deg); }
      }
      @keyframes wave {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-30px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Orbs -->
  <circle cx="1020" cy="110" r="160" fill="url(#glowGrad)" filter="url(#glow)" class="pulse-circle" />
  <circle cx="150" cy="280" r="120" fill="url(#glowGrad)" filter="url(#glow)" class="pulse-circle" style="animation-delay: -2s;" />

  <!-- Organic Wave Shapes -->
  <path d="M 0 310 Q 300 260 600 300 T 1200 280 L 1200 360 L 0 360 Z" fill="#042f24" opacity="0.4" class="wave-path" />
  <path d="M 0 330 Q 350 290 700 325 T 1200 310 L 1200 360 L 0 360 Z" fill="#064e3b" opacity="0.3" class="wave-path" style="animation-delay: -4s;" />

  <!-- Geometric Accent Borders / Frame -->
  <rect x="2" y="2" width="1196" height="356" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6" />

  <!-- Left Content Group -->
  <g transform="translate(70, 75)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.2" opacity="0.85" />
      <circle cx="18" cy="16" r="5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="badge-text">Curated ESG &amp; Climate Suite</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 75)">
      <text class="title-text">
        Awesome <tspan fill="url(#accentGrad)">Sustainability</tspan> Management
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 125)">
      <text class="subtitle-text">
        Enterprise SaaS, Carbon Accounting Engines, Scope 1-3 Disclosures &amp; Open-Source ESG Tools
      </text>
    </g>

    <!-- Feature Tags -->
    <g transform="translate(0, 175)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#0f3e30" stroke="#10b981" stroke-width="1" opacity="0.7" />
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">🌱 Carbon Accounting</text>

      <!-- Tag 2 -->
      <rect x="180" y="0" width="160" height="34" rx="8" fill="#0f3e30" stroke="#10b981" stroke-width="1" opacity="0.7" />
      <text x="194" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">📊 CSRD &amp; ISSB ESG</text>

      <!-- Tag 3 -->
      <rect x="355" y="0" width="150" height="34" rx="8" fill="#0f3e30" stroke="#10b981" stroke-width="1" opacity="0.7" />
      <text x="369" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">⚡ Green Software</text>

      <!-- Tag 4 -->
      <rect x="520" y="0" width="150" height="34" rx="8" fill="#0f3e30" stroke="#10b981" stroke-width="1" opacity="0.7" />
      <text x="534" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">🌍 Net-Zero APIs</text>
    </g>
  </g>

  <!-- Right Decorative Icon / Eco Illustration -->
  <g transform="translate(980, 160)" class="float-leaf">
    <!-- Center Eco Sphere -->
    <circle cx="0" cy="0" r="72" fill="#042f24" stroke="url(#accentGrad)" stroke-width="3" opacity="0.9" />
    <circle cx="0" cy="0" r="54" fill="#064e3b" opacity="0.5" />
    
    <!-- Rotating Ring -->
    <ellipse cx="0" cy="0" rx="90" ry="32" fill="none" stroke="#34d399" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </ellipse>
    
    <!-- Leaf / Planet Icon -->
    <path d="M -18 12 C -24 -15, 0 -32, 22 -22 C 28 8, 4 25, -18 12 Z" fill="url(#accentGrad)" opacity="0.9" />
    <path d="M -18 12 Q 0 -6 22 -22" stroke="#042f24" stroke-width="2.2" fill="none" />
  </g>
</svg>
